# Cursist-dashboard voor het virtuele EMS.
#
# Plak dit in het dashboard via Bewerken -> (rechtsboven) Ruwe configuratie-editor.
# Alle entiteiten heten hier virtueel_ems_...; heet jouw installatie anders,
# vervang dan overal virtueel_ems door de naam van jouw installatie in kleine
# letters met liggende streepjes. Het script scripts/dashboard_naam.py doet dat
# voor je.
#
# De kiosk-mode module hoort geinstalleerd te zijn (HACS -> Frontend ->
# kiosk-mode). Zonder die module werkt het dashboard gewoon, alleen blijven de
# zijbalk en de bovenbalk dan zichtbaar.

kiosk_mode:
  # Een cursist logt in met een niet-beheerdersaccount en ziet dus nooit de
  # zijbalk, de bovenbalk of het menu naar Instellingen.
  non_admin_settings:
    kiosk: true
  # De docent logt in als beheerder en houdt de gewone omgeving.
  admin_settings:
    hide_header: false
    hide_sidebar: false

title: Energiebeheer
views:
  - title: Bedienen
    path: bedienen
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 2
    sections:
      # --- Wat er nu gebeurt -------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Wat gebeurt er nu
            heading_style: title
            icon: mdi:flash

          - type: tile
            entity: sensor.virtueel_ems_pv_vermogen
            name: Zon levert
            color: orange
            icon: mdi:solar-power
            vertical: false

          - type: tile
            entity: sensor.virtueel_ems_huishoudelijk_verbruik
            name: Huis vraagt
            color: blue
            icon: mdi:home-lightning-bolt

          - type: tile
            entity: sensor.virtueel_ems_laadpaal_vermogen
            name: Auto laadt
            color: pink
            icon: mdi:ev-station

          - type: tile
            entity: sensor.virtueel_ems_batterij_vermogen_actueel
            name: Batterij (plus is laden)
            color: teal
            icon: mdi:home-battery

          - type: tile
            entity: sensor.virtueel_ems_net_vermogen
            name: Net (plus is afname)
            color: cyan
            icon: mdi:transmission-tower

          - type: gauge
            entity: sensor.virtueel_ems_net_vermogen
            name: Netaansluiting
            unit: W
            min: -8000
            max: 12000
            needle: true

      # --- De zon ------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: De zon
            heading_style: title
            icon: mdi:weather-sunny

          - type: tile
            entity: number.virtueel_ems_pv_bewolking
            name: Bewolking
            icon: mdi:weather-cloudy
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: sensor.virtueel_ems_pv_opbrengst
            name: Opgewekt vandaag
            color: orange
            icon: mdi:solar-power-variant

      # --- De batterij -------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: De thuisbatterij
            heading_style: title
            icon: mdi:home-battery

          - type: gauge
            entity: sensor.virtueel_ems_batterij_soc
            name: Laadtoestand
            min: 0
            max: 100
            needle: true
            severity:
              green: 20
              yellow: 10
              red: 0

          - type: tile
            entity: number.virtueel_ems_batterij_vermogen
            name: Doelvermogen (min is ontladen)
            icon: mdi:home-battery-outline
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: number.virtueel_ems_batterij_min_soc
            name: Niet verder ontladen dan
            icon: mdi:battery-alert-variant-outline
            features:
              - type: numeric-input
                style: slider

      # --- De laadpaal -------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: De laadpaal
            heading_style: title
            icon: mdi:ev-station

          - type: tile
            entity: switch.virtueel_ems_laadpaal_actief
            name: Auto aan de lader
            color: pink
            features:
              - type: toggle

          - type: tile
            entity: number.virtueel_ems_laadpaal_vermogen
            name: Laadvermogen
            icon: mdi:ev-plug-type2
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: sensor.virtueel_ems_laadpaal_verbruik
            name: Geladen in de auto
            color: pink
            icon: mdi:counter

      # --- De apparaten ------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Apparaten in huis
            heading_style: title
            icon: mdi:power-plug

          - type: tile
            entity: switch.virtueel_ems_wasmachine
            name: Wasmachine (2000 W)
            color: blue
            features:
              - type: toggle

          - type: tile
            entity: switch.virtueel_ems_boiler
            name: Boiler (2500 W)
            color: blue
            features:
              - type: toggle

          - type: tile
            entity: switch.virtueel_ems_airco
            name: Airco (1200 W)
            color: blue
            features:
              - type: toggle

      # --- Wat het opleverde -------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Wat het opleverde
            heading_style: title
            icon: mdi:counter

          - type: tile
            entity: sensor.virtueel_ems_net_afname
            name: Van het net gehaald
            color: cyan
            icon: mdi:transmission-tower-export

          - type: tile
            entity: sensor.virtueel_ems_net_teruglevering
            name: Aan het net geleverd
            color: purple
            icon: mdi:transmission-tower-import

          - type: history-graph
            title: De laatste tien minuten
            hours_to_show: 0.17
            entities:
              - entity: sensor.virtueel_ems_pv_vermogen
                name: Zon
              - entity: sensor.virtueel_ems_huishoudelijk_verbruik
                name: Huis
              - entity: sensor.virtueel_ems_laadpaal_vermogen
                name: Auto
              - entity: sensor.virtueel_ems_batterij_vermogen_actueel
                name: Batterij
              - entity: sensor.virtueel_ems_net_vermogen
                name: Net
